# 오른손 실물 데모 dataflow — 이 수업 키트(오른손)용
#  원본 dataflow_tracking_real.yml 과 같고, 포트 인자만 왼손 파일과 같은 형식으로.
#  넣을 위치:  <원본 Demo>/dataflow_tracking_real_right.yml
#  실행:  dora build dataflow_tracking_real_right.yml --uv   (최초 1회)
#         dora run   dataflow_tracking_real_right.yml --uv
#  ⚠️ --serialport 는 이 PC의 실제 포트로. Windows 는 /dev/ 없이 COMx.
nodes:
  - id: hand_tracker
    build: pip install -e HandTracking
    path: HandTracking/HandTracking/main.py
    inputs:
      tick: dora/timer/millis/50
    outputs:
      - r_hand_pos

  - id: r_hand_simulation
    build: pip install -e AHSimulation
    path: AHSimulation/AHSimulation/mj_mink_right.py
    inputs:
      r_hand_pos: hand_tracker/r_hand_pos
      tick: dora/timer/millis/2
      tick_ctrl: dora/timer/millis/10
    outputs:
      - mj_r_joints_pos

  - id: hand_controller
    build: cargo build -p AHControl
    path: target/debug/AHControl
    args: --serialport COM4 --config AHControl/config/r_hand.toml
    inputs:
      mj_r_joints_pos: r_hand_simulation/mj_r_joints_pos
