# Config for the left hand — 이 수업 키트(왼손)
#  · finger_name 은 l_finger1~4 (왼손 시뮬 노드 mj_mink_left.py 가 이 이름으로 보냄)
#  · motor id 는 이 키트의 실제 모터 ID (1~8). 매핑: f1=1·2, f2=3·4, f3=5·6, f4=7·8
#  · invert=true : 왼손은 오른손의 거울상이라 회전 방향 반대(false면 굽힘·폄이 뒤바뀜)
#  · offset 은 원본 값. 자세가 어긋나면 AHControl get_zeros 로 이 손의 영점을 다시 추출
#  넣을 위치:  <원본 Demo>/AHControl/config/l_hand.toml
[Fingers]
[[motors]]
finger_name="l_finger1"
motor1.id = 1
motor1.offset = 0.12217304763960307
motor1.invert = true
motor1.model = "SCS0009"
motor2.id = 2
motor2.offset = 0.08726646259971647
motor2.invert = true
motor2.model = "SCS0009"
