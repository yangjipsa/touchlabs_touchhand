<title>TouchHand Kit Sticker</title>
<style>
  :root{
    --paper:#FFFDF7; --ink:#1E2B47; --ink-soft:#63718C;
    --brand:#2F6FED; --sky:#4C9BE8; --orange:#F2994A; --coral:#EE5D5D;
    --window:#20406e; --line:#EBE6DA;
    --stage:#E9ECF2;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--stage);min-height:100vh;
    display:flex;align-items:center;justify-content:center;padding:28px;
    font-family:"Gothic A1",system-ui,sans-serif;color:var(--ink)}

  .sticker{
    width:min(90vmin,600px); aspect-ratio:1/1; background:var(--paper);
    border-radius:44px; padding:34px 34px 26px; position:relative; overflow:hidden;
    box-shadow:0 18px 50px rgba(31,43,71,.22), 0 2px 0 #fff inset;
    display:flex; flex-direction:column; gap:16px;
    outline:3px solid #fff; outline-offset:-11px;
  }
  /* playful confetti corners */
  .blob{position:absolute;border-radius:50%;filter:blur(.3px);opacity:.9;z-index:0}
  .b1{width:150px;height:150px;background:#FCE7CF;top:-46px;right:-30px}
  .b2{width:110px;height:110px;background:#DCEBFB;bottom:64px;left:-40px}

  header{display:flex;align-items:center;justify-content:space-between;z-index:2}
  .wordmark{font-family:"Fredoka",sans-serif;font-weight:700;font-size:40px;
    letter-spacing:-.5px;line-height:1}
  .wordmark .t{color:var(--ink)} .wordmark .h{color:var(--brand)}
  .kit-tag{font-family:"Fredoka",sans-serif;font-weight:600;font-size:11px;
    letter-spacing:1.5px;color:#fff;background:var(--brand);
    padding:7px 11px;border-radius:999px;white-space:nowrap}

  .stage{position:relative;flex:1;border-radius:30px;overflow:hidden;
    background:var(--window);z-index:1;
    box-shadow:0 10px 26px rgba(20,40,80,.28)}
  .stage img{width:100%;height:100%;object-fit:cover;object-position:50% 42%;display:block}

  /* the three shapes the kit teaches — floating near the fingertips */
  .chips{position:absolute;top:16px;left:0;right:0;display:flex;
    justify-content:center;gap:18px;z-index:2}
  .chip{width:46px;height:46px;display:grid;place-items:center;
    background:rgba(255,255,255,.94);border-radius:14px;
    box-shadow:0 6px 14px rgba(10,25,55,.35)}
  .chip.oval{border-radius:14px}
  .dot{background:var(--sky);width:26px;height:26px;border-radius:50%}
  .egg{background:var(--orange);width:30px;height:22px;border-radius:50%}
  .cube{background:var(--coral);width:24px;height:24px;border-radius:5px;transform:rotate(8deg)}
  .scan{position:absolute;inset:-6px;border:2px dashed rgba(255,255,255,.75);
    border-radius:18px}

  footer{display:flex;flex-direction:column;gap:9px;z-index:2}
  .tagline{font-family:"Jua",sans-serif;font-size:20px;color:var(--ink);
    line-height:1.25;text-wrap:balance}
  .tagline b{color:var(--brand)}
  .brandrow{display:flex;align-items:center;justify-content:space-between;
    border-top:2px dotted var(--line);padding-top:10px}
  .brand{font-family:"Fredoka",sans-serif;font-weight:600;font-size:13px;
    letter-spacing:1px;color:var(--ink-soft)}
  .site{font-family:"Gothic A1";font-weight:800;font-size:13px;color:var(--brand)}
  .legend{display:flex;gap:12px;align-items:center;font-family:"Gothic A1";
    font-weight:600;font-size:11px;color:var(--ink-soft)}
  .lg{display:flex;align-items:center;gap:5px}
  .sw{width:11px;height:11px;border-radius:50%}
</style>

<div class="sticker">
  <div class="blob b1"></div>
  <div class="blob b2"></div>

  <header>
    <div class="wordmark"><span class="t">Touch</span><span class="h">Hand</span></div>
    <div class="kit-tag">PHYSICAL&nbsp;AI&nbsp;KIT</div>
  </header>

  <div class="stage">
    <div class="chips">
      <div class="chip"><div class="dot"></div></div>
      <div class="chip oval" style="position:relative"><div class="egg"></div><div class="scan"></div></div>
